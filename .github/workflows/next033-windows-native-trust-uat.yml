name: NEXT033 Canonical Installer Identity Probe

on:
  push:
    branches:
      - "codex/next033-windows-uat-orchestration"

permissions:
  contents: read
  actions: read

jobs:
  canonical-installer-identity:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CANONICAL_RUN_ID: "33933622073"
      CANONICAL_RUNTIME_SHA: "77952884cfa93559157536e6b884a12522f4f5f02123fe8717ba91ea3a0dae9d"
      CANONICAL_RUNTIME_SIZE: "76444672"
      CANONICAL_INSTALLER_SHA: "e02b61b270181cffa52dff37fb3f90db8b5ed3428df001f3e0cf733d0c79c5d4"
      OWNER_OBSERVED_RUNTIME_SHA: "2031fc4b9185b1c649f75b5463ebd0d2a09c603dd8edcf0419aff700a57e131c"
    steps:
      - name: Download exact canonical acceptance artifact
        uses: actions/download-artifact@v4
        with:
          name: LightBI-Windows-NEXT033-R1P13-Native-Trust-Acceptance
          path: canonical
          github-token: ${{ github.token }}
          repository: n8n2erpnext/LightBI
          run-id: 33933622073
      - name: Prove downloaded artifact identity
        shell: pwsh
        run: |
          $runtime = Get-Item 'canonical/LightBI.exe' -ErrorAction Stop
          $installer = Get-ChildItem 'canonical/LightBI-NEXT-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'canonical NSIS installer missing' }
          $runtimeSha = (Get-FileHash $runtime.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($runtimeSha -ne $env:CANONICAL_RUNTIME_SHA) { throw "downloaded runtime drift: $runtimeSha" }
          if ($runtime.Length -ne [int64]$env:CANONICAL_RUNTIME_SIZE) { throw "downloaded runtime size drift: $($runtime.Length)" }
          if ($installerSha -ne $env:CANONICAL_INSTALLER_SHA) { throw "downloaded installer drift: $installerSha" }
          Write-Host "CANONICAL_STANDALONE_SHA=$runtimeSha"
          Write-Host "CANONICAL_INSTALLER_SHA=$installerSha"
      - name: Silent install canonical NSIS payload
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'canonical/LightBI-NEXT-*.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'lightbi-next033-probe'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "NSIS silent install failed: exit=$($proc.ExitCode)" }
          Get-Process LightBI -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $installed = @(Get-ChildItem $installDir -Recurse -Filter 'LightBI.exe' -File)
          if ($installed.Count -ne 1) { throw "expected one installed LightBI.exe, found $($installed.Count)" }
          $installedExe = $installed[0]
          $installedSha = (Get-FileHash $installedExe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installedSize = $installedExe.Length
          $matchesCanonical = $installedSha -eq $env:CANONICAL_RUNTIME_SHA -and $installedSize -eq [int64]$env:CANONICAL_RUNTIME_SIZE
          $matchesOwner = $installedSha -eq $env:OWNER_OBSERVED_RUNTIME_SHA
          $evidence = [ordered]@{
            schema = 'lightbi.next033-installer-identity-probe.v1'
            canonical_run_id = $env:CANONICAL_RUN_ID
            canonical_runtime_sha256 = $env:CANONICAL_RUNTIME_SHA
            canonical_runtime_size = [int64]$env:CANONICAL_RUNTIME_SIZE
            canonical_installer_sha256 = $env:CANONICAL_INSTALLER_SHA
            installed_path = $installedExe.FullName
            installed_sha256 = $installedSha
            installed_size = [int64]$installedSize
            installed_matches_canonical = $matchesCanonical
            installed_matches_owner_observation = $matchesOwner
            production_authority = $false
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content installer-identity-probe.json
          "INSTALLED_SHA=$installedSha" | Add-Content $env:GITHUB_ENV
          "INSTALLED_SIZE=$installedSize" | Add-Content $env:GITHUB_ENV
          "IDENTITY_MATCH=$($matchesCanonical.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
          Write-Host "INSTALLED_RUNTIME_SHA=$installedSha"
          Write-Host "INSTALLED_RUNTIME_SIZE=$installedSize"
          Write-Host "INSTALLED_MATCHES_CANONICAL=$matchesCanonical"
          Write-Host "INSTALLED_MATCHES_OWNER_OBSERVATION=$matchesOwner"
      - name: Upload installer identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightBI-NEXT033-Canonical-Installer-Identity-Probe
          retention-days: 14
          path: installer-identity-probe.json
          if-no-files-found: error
      - name: Enforce installer/runtime byte identity
        shell: pwsh
        run: |
          if ($env:IDENTITY_MATCH -ne 'true') {
            throw "installer identity drift: installed=$env:INSTALLED_SHA size=$env:INSTALLED_SIZE canonical=$env:CANONICAL_RUNTIME_SHA/$env:CANONICAL_RUNTIME_SIZE"
          }
          Write-Host 'INSTALLER_RUNTIME_IDENTITY=PASS'
