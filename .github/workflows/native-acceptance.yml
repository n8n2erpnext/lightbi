name: Native Acceptance Artifact

on:
  push:
    branches:
      - "codex/native-acceptance-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Verify release and updater contracts
        shell: pwsh
        run: |
          pnpm test:release-contract
          pnpm test:public-boundary
          pnpm --dir apps/desktop exec vitest run src/stores/update-store.test.ts src/components/settings/UpdateSettingsPanel.test.tsx src/components/settings/BuildIdentityPanel.test.tsx
      - name: Generate branded application icons
        shell: pwsh
        run: |
          pnpm dlx @tauri-apps/cli@2.11.4 icon apps/desktop/public/branding/lightbi-app-icon.png --output crates/lightbi-tauri/icons
          node scripts/validate-native-icons.mjs
      - name: Verify staged updater integrity gates
        run: cargo test -p lightbi-tauri updater_tests --target x86_64-pc-windows-msvc
      - name: Build Windows acceptance installer
        working-directory: crates/lightbi-tauri
        shell: pwsh
        env:
          VITE_LIGHTBI_DISTRIBUTION_URL: https://lightbi.thaiduy.digital/distribution
          VITE_LIGHTBI_VERSION: 0.9.2-beta.7-native.${{ github.run_number }}
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --config tauri.windows.conf.json
      - name: Generate checksum and provenance
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -NoNewline "$($installer.FullName).sha256"
          $evidence = [ordered]@{
            schema = "lightbi.native-acceptance.v1"
            source_sha = "${{ github.sha }}"
            source_ref = "${{ github.ref_name }}"
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            installer = $installer.Name
            sha256 = $hash
            unsigned = $true
          }
          $evidence | ConvertTo-Json | Set-Content "target/x86_64-pc-windows-msvc/release/bundle/nsis/native-acceptance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: LightBI-Windows-Native-Acceptance
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            target/x86_64-pc-windows-msvc/release/bundle/nsis/native-acceptance.json
          if-no-files-found: error
