name: Native Acceptance Artifact

on:
  push:
    branches:
      - "codex/native-acceptance-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LIGHTBI_ACCEPTANCE_VERSION: 0.9.2-next.r1p12.${{ github.run_number }}
      LIGHTBI_ACCEPTANCE_GENERATION: g-actions-r1p12-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Verify release and updater contracts
        shell: pwsh
        run: |
          pnpm test:release-contract
          pnpm test:public-boundary
          pnpm --dir apps/desktop exec vitest run src/stores/update-store.test.ts src/components/settings/UpdateSettingsPanel.test.tsx src/components/settings/BuildIdentityPanel.test.tsx src/lib/native-runtime.test.ts
      - name: Generate branded application icons
        shell: pwsh
        run: |
          pnpm dlx @tauri-apps/cli@2.11.4 icon apps/desktop/public/branding/lightbi-app-icon.png --output crates/lightbi-tauri/icons
          node scripts/validate-native-icons.mjs
      - name: Verify native shell, updater and Windows publisher gates
        shell: pwsh
        run: |
          node scripts/validate-native-capabilities.mjs
          cargo test -p lightbi-tauri updater_tests --target x86_64-pc-windows-msvc
          cargo test -p lightbi-tauri windows_publisher --target x86_64-pc-windows-msvc
      - name: Build Windows R1-P12 NEXT acceptance installer
        working-directory: crates/lightbi-tauri
        shell: pwsh
        env:
          LIGHTBI_RUNTIME_CHANNEL: internal
          VITE_LIGHTBI_GENERATION_ID: ${{ env.LIGHTBI_ACCEPTANCE_GENERATION }}
          VITE_LIGHTBI_PARENT_GENERATION_ID: g-2026-09-03-next-030
          VITE_LIGHTBI_CHANNEL: internal
          VITE_LIGHTBI_CORE_COMMIT: ${{ github.sha }}
          VITE_LIGHTBI_CONTROL_PLANE_COMMIT: bb50b0d53542da5cd908e2237cbca368f7f87073
          VITE_LIGHTBI_CONTROL_PLANE_SCHEMA_VERSION: 067_catalog_quarterly_pricing
          VITE_LIGHTBI_TEST_PACK_VERSION: r1p12-windows-native-acceptance
          VITE_LIGHTBI_TRUST_STATUS: phase2a_unfrozen
          VITE_LIGHTBI_TRUST_PHASE2A_HEAD: 10de4da8e551a46f93f7b62985a0a6e611581b8e
          VITE_LIGHTBI_RELEASE_UPDATE_CHANNEL: internal
          VITE_LIGHTBI_ANALYTICS_NAMESPACE: internal/r1p12-windows-native-acceptance
          VITE_LIGHTBI_RELEASE_NAMESPACE: internal/lightbi/r1p12-windows-native-acceptance
          VITE_LIGHTBI_SOURCE_BRANCH: ${{ github.ref_name }}
          VITE_LIGHTBI_SOURCE_COMMIT: ${{ github.sha }}
          VITE_LIGHTBI_BUILDER: github-actions/windows-native-acceptance
          VITE_LIGHTBI_INFRA_DATABASE_SCOPE: internal
          VITE_LIGHTBI_INFRA_REDIS_SCOPE: internal
          VITE_LIGHTBI_INFRA_DATA_SCOPE: internal
          VITE_LIGHTBI_INFRA_ANALYTICS_SCOPE: internal
          VITE_LIGHTBI_INFRA_RELEASES_SCOPE: internal
          VITE_LIGHTBI_INFRA_INTEGRATIONS_SCOPE: internal
        run: |
          $env:VITE_LIGHTBI_VERSION = $env:LIGHTBI_ACCEPTANCE_VERSION
          $env:VITE_LIGHTBI_BUILD_TIMESTAMP = (Get-Date).ToUniversalTime().ToString("o")
          @{ version = $env:LIGHTBI_ACCEPTANCE_VERSION } | ConvertTo-Json | Set-Content tauri.acceptance.conf.json
          pnpm dlx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --config tauri.windows.conf.json --config tauri.acceptance.conf.json
      - name: Generate canonical installed-runtime, publisher and provenance evidence
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path 'target/x86_64-pc-windows-msvc/release').Path
          $prebundleRuntime = Get-Item "$releaseRoot/LightBI.exe" -ErrorAction Stop
          $installer = Get-ChildItem "$releaseRoot/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $name = "LightBI-NEXT-$env:LIGHTBI_ACCEPTANCE_VERSION-x64-setup.exe"
          $normalized = Join-Path $installer.Directory.FullName $name
          Move-Item $installer.FullName $normalized -Force

          $installDir = Join-Path $env:RUNNER_TEMP "lightbi-dpr10-canonical-install"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $normalized -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS canonical install failed: exit=$($install.ExitCode)" }
          Get-Process LightBI -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $installed = @(Get-ChildItem $installDir -Recurse -Filter 'LightBI.exe' -File)
          if ($installed.Count -ne 1) { throw "expected one installed LightBI.exe, found $($installed.Count)" }
          $runtimeCopy = Join-Path $installer.Directory.FullName 'LightBI.exe'
          Copy-Item $installed[0].FullName $runtimeCopy -Force

          $runtimeHash = (Get-FileHash -Algorithm SHA256 $runtimeCopy).Hash.ToLowerInvariant()
          $runtimeSize = (Get-Item $runtimeCopy).Length
          $hash = (Get-FileHash -Algorithm SHA256 $normalized).Hash.ToLowerInvariant()
          $size = (Get-Item $normalized).Length
          $prebundleHash = (Get-FileHash -Algorithm SHA256 $prebundleRuntime.FullName).Hash.ToLowerInvariant()
          $prebundleSize = $prebundleRuntime.Length
          "$runtimeHash  LightBI.exe" | Set-Content -NoNewline "$runtimeCopy.sha256"
          "$hash  $name" | Set-Content -NoNewline "$normalized.sha256"

          $runtimePublisher = "$runtimeCopy.publisher.json"
          $publisher = "$normalized.publisher.json"
          ./scripts/collect-windows-publisher-evidence.ps1 -Installer $runtimeCopy -Output $runtimePublisher
          ./scripts/collect-windows-publisher-evidence.ps1 -Installer $normalized -Output $publisher
          node scripts/validate-windows-publisher-evidence.mjs --evidence $runtimePublisher --mode beta --expected-sha256 $runtimeHash
          node scripts/validate-windows-publisher-evidence.mjs --evidence $publisher --mode beta --expected-sha256 $hash
          $publisherEvidence = Get-Content $publisher -Raw | ConvertFrom-Json

          $runtimeAcceptance = [ordered]@{
            schema = 'lightbi.native-runtime-acceptance.v1'
            environment = 'next_internal_test_only'
            stage = 'dpr10_native'
            version = $env:LIGHTBI_ACCEPTANCE_VERSION
            release_channel = 'beta'
            generation_id = $env:LIGHTBI_ACCEPTANCE_GENERATION
            source_sha = '${{ github.sha }}'
            source_ref = '${{ github.ref_name }}'
            control_plane_sha = 'bb50b0d53542da5cd908e2237cbca368f7f87073'
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            runtime_artifact = 'LightBI.exe'
            runtime_release_id = "release:$($env:LIGHTBI_ACCEPTANCE_VERSION):windows:x86_64:runtime"
            runtime_sha256 = $runtimeHash
            runtime_size = [int64]$runtimeSize
            runtime_identity_source = 'nsis_silent_install'
            installer_payload_verified = $true
            prebundle_runtime_sha256 = $prebundleHash
            prebundle_runtime_size = [int64]$prebundleSize
            installer = $name
            sha256 = $hash
            installer_size = [int64]$size
            publisher_status = $publisherEvidence.signature_status
            production_authority = $false
            stable_publication_authority = $false
            owner_uat_accepted = $false
            trust_ready = $false
            trust_publication_state = 'pending_external_runtime_rel'
          }
          $runtimeAcceptance | ConvertTo-Json -Depth 6 | Set-Content "$($installer.Directory.FullName)/native-runtime-acceptance.json"

          $evidence = [ordered]@{
            schema = "lightbi.native-acceptance.v3"
            version = $env:LIGHTBI_ACCEPTANCE_VERSION
            generation_id = $env:LIGHTBI_ACCEPTANCE_GENERATION
            source_sha = "${{ github.sha }}"
            source_ref = "${{ github.ref_name }}"
            control_plane_sha = "bb50b0d53542da5cd908e2237cbca368f7f87073"
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            installer = $name
            sha256 = $hash
            installer_size = [int64]$size
            runtime_artifact = 'LightBI.exe'
            runtime_release_id = "release:$($env:LIGHTBI_ACCEPTANCE_VERSION):windows:x86_64:runtime"
            runtime_sha256 = $runtimeHash
            runtime_size = [int64]$runtimeSize
            runtime_identity_source = 'nsis_silent_install'
            installer_payload_verified = $true
            publisher_status = $publisherEvidence.signature_status
            trust_ready = $false
            production_authority = $false
          }
          $acceptanceJson = $evidence | ConvertTo-Json -Compress
          $acceptanceJson | Set-Content "$($installer.Directory.FullName)/native-acceptance.json"
          Write-Host "LIGHTBI_NATIVE_ACCEPTANCE=$acceptanceJson"
          Write-Host "LIGHTBI_INSTALLED_RUNTIME_SHA=$runtimeHash"
          Write-Host "LIGHTBI_INSTALLED_RUNTIME_SIZE=$runtimeSize"
          Write-Host "LIGHTBI_RUNTIME_RELEASE_ID=release:$($env:LIGHTBI_ACCEPTANCE_VERSION):windows:x86_64:runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: LightBI-Windows-R1P12-Native-Acceptance
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.publisher.json
            target/x86_64-pc-windows-msvc/release/bundle/nsis/native-acceptance.json
            target/x86_64-pc-windows-msvc/release/bundle/nsis/native-runtime-acceptance.json
          if-no-files-found: error
