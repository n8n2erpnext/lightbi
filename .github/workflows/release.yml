name: Windows Beta Release

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Verify distribution portal
        run: |
          pnpm --dir apps/distribution test
          pnpm --dir apps/distribution build
      - name: Generate branded application icons
        run: pnpm dlx @tauri-apps/cli@2.11.4 icon apps/desktop/public/branding/lightbi-icon.svg --output crates/lightbi-tauri/icons
      - name: Build web surface
        env:
          VITE_LIGHTBI_DISTRIBUTION_URL: https://lightbi.thaiduy.digital/distribution
          VITE_LIGHTBI_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $env:VITE_LIGHTBI_VERSION = $env:VITE_LIGHTBI_VERSION.TrimStart('v')
          pnpm --filter @lightbi/desktop build
      - name: Build native Windows installer
        working-directory: crates/lightbi-tauri
        run: pnpm dlx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --config tauri.windows.conf.json
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -NoNewline "target/x86_64-pc-windows-msvc/release/bundle/nsis/$($installer.Name).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: LightBI-Windows-Beta
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
      - name: Publish immutable release to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $channel = if ($version -match '-beta\.') { 'beta' } else { 'stable' }
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          $checksumFile = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256" | Select-Object -First 1
          if (-not $installer -or -not $checksumFile) { throw 'Release artifact or checksum missing' }
          $key = "release/lightbi/$version/$($installer.Name)"
          aws s3api head-object --bucket $env:R2_BUCKET --key $key --endpoint-url $endpoint 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Immutable R2 object already exists: $key" }
          $sha = ((Get-Content $checksumFile.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $public = $env:R2_PUBLIC_URL.TrimEnd('/')
          New-Item -ItemType Directory -Force .release | Out-Null
          $indexInput = '.release/index.previous.json'
          try { Invoke-WebRequest "$public/release/lightbi/index.json" -OutFile $indexInput -UseBasicParsing } catch { '{}' | Set-Content $indexInput }
          node scripts/build-release-manifest.mjs --version $version --channel $channel --artifact $installer.FullName --artifact-url "$public/$key" --sha256 $sha --size $installer.Length --platform windows --architecture x86_64 --kind exe --minimum-updater-version 0.9.1-beta.7 --output .release/manifest.json --index-input $indexInput --index-output .release/index.json
          aws s3 cp $installer.FullName "s3://$env:R2_BUCKET/$key" --endpoint-url $endpoint --cache-control "public,max-age=31536000,immutable" --content-type "application/vnd.microsoft.portable-executable"
          aws s3 cp $checksumFile.FullName "s3://$env:R2_BUCKET/$key.sha256" --endpoint-url $endpoint --cache-control "public,max-age=31536000,immutable" --content-type "text/plain"
          aws s3 cp .release/manifest.json "s3://$env:R2_BUCKET/release/lightbi/$version/manifest.json" --endpoint-url $endpoint --cache-control "public,max-age=31536000,immutable" --content-type "application/json"
          aws s3 cp .release/index.json "s3://$env:R2_BUCKET/release/lightbi/index.json" --endpoint-url $endpoint --cache-control "public,max-age=60,must-revalidate" --content-type "application/json"
          aws s3 cp .release/manifest.json "s3://$env:R2_BUCKET/release/lightbi/$channel/latest.json" --endpoint-url $endpoint --cache-control "public,max-age=60,must-revalidate" --content-type "application/json"
          aws s3 cp .release/manifest.json "s3://$env:R2_BUCKET/release/lightbi/latest.json" --endpoint-url $endpoint --cache-control "public,max-age=60,must-revalidate" --content-type "application/json"
