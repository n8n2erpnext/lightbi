name: Windows Beta Release

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard-beta-authority:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce Beta-only publication authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9A-Za-z.-]+$ ]]; then
            echo "This workflow may publish Beta tags only; refusing ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

  build-windows:
    needs: [guard-beta-authority]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Verify public Basic release contract
        run: |
          pnpm test:release-contract
          pnpm test:public-boundary
      - name: Verify desktop updater state machine
        run: pnpm --dir apps/desktop exec vitest run src/stores/update-store.test.ts src/components/settings/UpdateSettingsPanel.test.tsx
      - name: Generate branded application icons
        run: |
          pnpm dlx @tauri-apps/cli@2.11.4 icon apps/desktop/public/branding/lightbi-app-icon.png --output crates/lightbi-tauri/icons
          node scripts/validate-native-icons.mjs
      - name: Verify staged updater integrity gates
        run: cargo test -p lightbi-tauri updater_tests --target x86_64-pc-windows-msvc
      - name: Build native Windows installer
        working-directory: crates/lightbi-tauri
        shell: pwsh
        env:
          VITE_LIGHTBI_VERSION: ${{ github.ref_name }}
        run: |
          $env:VITE_LIGHTBI_VERSION = $env:VITE_LIGHTBI_VERSION.TrimStart('v')
          pnpm dlx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --config tauri.windows.conf.json
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($installer.FullName)
          if (-not $icon) { throw "NSIS installer has no embedded icon" }
          $bitmap = $icon.ToBitmap()
          $yellow = 0
          $opaque = 0
          for ($x = 0; $x -lt $bitmap.Width; $x++) {
            for ($y = 0; $y -lt $bitmap.Height; $y++) {
              $pixel = $bitmap.GetPixel($x, $y)
              if ($pixel.A -gt 32) {
                $opaque++
                if ($pixel.R -gt 180 -and $pixel.G -gt 120 -and $pixel.B -lt 100) { $yellow++ }
              }
            }
          }
          $bitmap.Dispose()
          $icon.Dispose()
          if ($opaque -eq 0 -or ($yellow / $opaque) -lt 0.20) { throw "NSIS installer does not contain the branded LightBI icon" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -NoNewline "$($installer.FullName).sha256"
      - name: Record Windows Authenticode publisher evidence
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $evidence = "$($installer.FullName).publisher.json"
          ./scripts/collect-windows-publisher-evidence.ps1 -Installer $installer.FullName -Output $evidence
          node scripts/validate-windows-publisher-evidence.mjs --evidence $evidence --mode beta --expected-sha256 $hash
      - uses: actions/upload-artifact@v4
        with:
          name: LightBI-Windows-Beta
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.publisher.json
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [guard-beta-authority, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: LightBI-Windows-Beta
          path: .artifacts/windows
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            .artifacts/windows/*
      - name: Publish immutable Windows artifact and Beta manifest to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '\r\n')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n')"
          export R2_ACCOUNT_ID="$(printf '%s' "$R2_ACCOUNT_ID" | tr -d '\r\n')"
          export R2_BUCKET="$(printf '%s' "$R2_BUCKET" | tr -d '\r\n')"
          export R2_PUBLIC_URL="$(printf '%s' "$R2_PUBLIC_URL" | tr -d '\r\n')"
          python -m pip install --disable-pip-version-check --quiet awscli
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" == *-beta.* ]] || { echo "Beta workflow refuses non-Beta version: $version" >&2; exit 1; }
          channel=beta
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          public="${R2_PUBLIC_URL%/}"
          windows=$(find .artifacts/windows -type f -name '*.exe' | head -1)
          test -n "$windows"
          windows_publisher="$windows.publisher.json"
          test -f "$windows_publisher"
          windows_sha=$(awk '{print tolower($1)}' "$windows.sha256")
          windows_key="release/lightbi/$version/$(basename "$windows")"
          windows_publisher_key="$windows_key.publisher.json"
          if aws s3api head-object --bucket "$R2_BUCKET" --key "$windows_key" --endpoint-url "$endpoint" >/dev/null 2>&1; then echo "Immutable object exists: $windows_key"; exit 1; fi
          if aws s3api head-object --bucket "$R2_BUCKET" --key "$windows_publisher_key" --endpoint-url "$endpoint" >/dev/null 2>&1; then echo "Immutable object exists: $windows_publisher_key"; exit 1; fi
          mkdir -p .release
          jq -n \
            --arg windows_name "$(basename "$windows")" --arg windows_url "$public/$windows_key" --arg windows_sha "$windows_sha" --argjson windows_size "$(stat -c%s "$windows")" \
            '[{platform:"windows",architecture:"x86_64",kind:"exe",filename:$windows_name,url:$windows_url,size:$windows_size,sha256:$windows_sha}]' > .release/artifacts.json
          if ! curl --fail --silent --show-error "$public/release/lightbi/index.json" -o .release/index.previous.json; then echo 'null' > .release/index.previous.json; fi
          node scripts/build-release-manifest.mjs --version "$version" --channel "$channel" --artifacts-json .release/artifacts.json --minimum-updater-version 0.9.1-beta.7 --output .release/manifest.json --index-input .release/index.previous.json --index-output .release/index.json
          aws s3 cp "$windows" "s3://$R2_BUCKET/$windows_key" --endpoint-url "$endpoint" --cache-control "public,max-age=31536000,immutable" --content-type "application/vnd.microsoft.portable-executable"
          aws s3 cp "$windows.sha256" "s3://$R2_BUCKET/$windows_key.sha256" --endpoint-url "$endpoint" --cache-control "public,max-age=31536000,immutable" --content-type "text/plain"
          aws s3 cp "$windows_publisher" "s3://$R2_BUCKET/$windows_publisher_key" --endpoint-url "$endpoint" --cache-control "public,max-age=31536000,immutable" --content-type "application/json"
          aws s3 cp .release/manifest.json "s3://$R2_BUCKET/release/lightbi/$version/manifest.json" --endpoint-url "$endpoint" --cache-control "public,max-age=31536000,immutable" --content-type "application/json"
          aws s3 cp .release/index.json "s3://$R2_BUCKET/release/lightbi/index.json" --endpoint-url "$endpoint" --cache-control "public,max-age=60,must-revalidate" --content-type "application/json"
          aws s3 cp .release/manifest.json "s3://$R2_BUCKET/release/lightbi/$channel/latest.json" --endpoint-url "$endpoint" --cache-control "public,max-age=60,must-revalidate" --content-type "application/json"
          global_latest_channel=""
          if aws s3 cp "s3://$R2_BUCKET/release/lightbi/latest.json" .release/latest.previous.json --endpoint-url "$endpoint" >/dev/null 2>&1; then
            global_latest_channel=$(jq -r '.channel // empty' .release/latest.previous.json)
          fi
          if [[ "$global_latest_channel" == "stable" ]]; then
            echo "Preserving stable global latest.json; Beta may update beta/latest.json only."
          else
            aws s3 cp .release/manifest.json "s3://$R2_BUCKET/release/lightbi/latest.json" --endpoint-url "$endpoint" --cache-control "public,max-age=60,must-revalidate" --content-type "application/json"
          fi
