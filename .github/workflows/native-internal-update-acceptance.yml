name: NEXT Internal Update Acceptance

on:
  push:
    branches:
      - "codex/next025-native-boundary"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-a-b:
    strategy:
      fail-fast: true
      matrix:
        slot: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Resolve acceptance version
        shell: pwsh
        run: |
          $version = "0.9.2-next.25.${{ github.run_number }}.${{ matrix.slot }}"
          "LIGHTBI_ACCEPTANCE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIGHTBI_ACCEPTANCE_SLOT=${{ matrix.slot }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify updater and native-boundary contracts
        shell: pwsh
        run: |
          pnpm --dir apps/desktop exec vitest run src/stores/update-store.test.ts src/lib/native-capabilities.test.ts src/components/layout/UpdateStatusBar.test.tsx src/stores/announcement-store.test.ts src/lib/native-boundary-contract.test.ts src/lib/account-api.test.ts src/lib/generation-diagnostics.test.ts
          cargo test -p lightbi-tauri updater_tests --target x86_64-pc-windows-msvc
          $env:LIGHTBI_LIVE_RELEASE_CATALOG = "https://lightbi-next.thaiduy.digital/api/releases/latest"
          cargo test -p lightbi-tauri native_http_reaches_live_internal_release_catalog --target x86_64-pc-windows-msvc -- --ignored --nocapture
      - name: Generate branded application icons
        shell: pwsh
        run: |
          pnpm dlx @tauri-apps/cli@2.11.4 icon apps/desktop/public/branding/lightbi-app-icon.png --output crates/lightbi-tauri/icons
          node scripts/validate-native-icons.mjs
      - name: Build Windows NEXT installer
        working-directory: crates/lightbi-tauri
        shell: pwsh
        env:
          VITE_LIGHTBI_DISTRIBUTION_URL: https://lightbi-next.thaiduy.digital
          VITE_LIGHTBI_GENERATION_ID: g-2026-09-01-next-025
          VITE_LIGHTBI_PARENT_GENERATION_ID: g-2026-09-01-next-024
          VITE_LIGHTBI_CHANNEL: internal
          VITE_LIGHTBI_CORE_COMMIT: ${{ github.sha }}
          VITE_LIGHTBI_CONTROL_PLANE_COMMIT: 2b72e91b32b7f956eb9f1fe26bd4ec39eb4b76d0
          VITE_LIGHTBI_CONTROL_PLANE_SCHEMA_VERSION: 065_marketing_newsletter_mail
          VITE_LIGHTBI_TEST_PACK_VERSION: next-025-native-boundary-update-acceptance
          VITE_LIGHTBI_TRUST_STATUS: phase2a_unfrozen
          VITE_LIGHTBI_RELEASE_UPDATE_CHANNEL: internal
          VITE_LIGHTBI_ANALYTICS_NAMESPACE: internal/native-acceptance
          VITE_LIGHTBI_RELEASE_NAMESPACE: internal/lightbi-next
          VITE_LIGHTBI_SOURCE_BRANCH: ${{ github.ref_name }}
          VITE_LIGHTBI_SOURCE_COMMIT: ${{ github.sha }}
          VITE_LIGHTBI_BUILDER: github-actions
          VITE_LIGHTBI_INFRA_DATABASE_SCOPE: internal
          VITE_LIGHTBI_INFRA_REDIS_SCOPE: internal
          VITE_LIGHTBI_INFRA_DATA_SCOPE: internal
          VITE_LIGHTBI_INFRA_ANALYTICS_SCOPE: internal
          VITE_LIGHTBI_INFRA_RELEASES_SCOPE: internal
          VITE_LIGHTBI_INFRA_INTEGRATIONS_SCOPE: internal
        run: |
          $env:VITE_LIGHTBI_VERSION = $env:LIGHTBI_ACCEPTANCE_VERSION
          $env:VITE_LIGHTBI_BUILD_TIMESTAMP = (Get-Date).ToUniversalTime().ToString("o")
          @{ version = $env:LIGHTBI_ACCEPTANCE_VERSION } | ConvertTo-Json | Set-Content tauri.acceptance.conf.json
          pnpm dlx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --config tauri.windows.conf.json --config tauri.acceptance.conf.json
      - name: Normalize installer, checksum and provenance
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $name = "LightBI-NEXT-$env:LIGHTBI_ACCEPTANCE_VERSION-x64-setup.exe"
          $normalized = Join-Path $installer.Directory.FullName $name
          Move-Item $installer.FullName $normalized -Force
          $hash = (Get-FileHash -Algorithm SHA256 $normalized).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -NoNewline "$normalized.sha256"
          $evidence = [ordered]@{
            schema = "lightbi.native-update-acceptance.v1"
            version = $env:LIGHTBI_ACCEPTANCE_VERSION
            slot = [int]$env:LIGHTBI_ACCEPTANCE_SLOT
            generation_id = "g-2026-09-01-next-025"
            source_sha = "${{ github.sha }}"
            control_plane_sha = "2b72e91b32b7f956eb9f1fe26bd4ec39eb4b76d0"
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            installer = $name
            sha256 = $hash
            unsigned = $true
          }
          $evidence | ConvertTo-Json | Set-Content "$($installer.Directory.FullName)/native-acceptance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: LightBI-Windows-NEXT-${{ matrix.slot }}
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/LightBI-NEXT-*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/LightBI-NEXT-*.sha256
            target/x86_64-pc-windows-msvc/release/bundle/nsis/native-acceptance.json
          if-no-files-found: error

  publish-internal-r2:
    needs: windows-a-b
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LightBI-Windows-NEXT-*
          path: .internal
      - name: Build immutable A/B manifests and index
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .release
          echo null > .release/index-0.json
          index=.release/index-0.json
          for slot in 1 2; do
            dir=".internal/LightBI-Windows-NEXT-$slot"
            meta="$dir/native-acceptance.json"
            version=$(jq -r .version "$meta")
            exe=$(find "$dir" -maxdepth 1 -type f -name '*.exe' -print -quit)
            sha=$(jq -r .sha256 "$meta")
            filename=$(basename "$exe")
            size=$(stat -c %s "$exe")
            url="https://lightbi-next.thaiduy.digital/internal-releases/$version/$filename"
            out=".release/manifest-$slot.json"
            next_index=".release/index-$slot.json"
            node scripts/build-release-manifest.mjs --version "$version" --channel beta --artifact "$exe" --artifact-url "$url" --sha256 "$sha" --size "$size" --platform windows --architecture x86_64 --kind exe --output "$out" --index-input "$index" --index-output "$next_index" --release-notes "LightBI NEXT-025 internal update acceptance slot $slot"
            index="$next_index"
          done
          cp .release/manifest-2.json .release/latest.json
          cp .release/index-2.json .release/index.json
      - name: Upload only to internal/lightbi-next
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="lightbi-next/releases"
          for slot in 1 2; do
            dir=".internal/LightBI-Windows-NEXT-$slot"
            meta="$dir/native-acceptance.json"
            version=$(jq -r .version "$meta")
            exe=$(find "$dir" -maxdepth 1 -type f -name '*.exe' -print -quit)
            filename=$(basename "$exe")
            key="$prefix/$version/$filename"
            if aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$endpoint" >/dev/null 2>&1; then echo "immutable object exists: $key"; exit 1; fi
            aws s3 cp "$exe" "s3://$R2_BUCKET/$key" --endpoint-url "$endpoint" --cache-control "private,max-age=31536000,immutable" --content-type "application/vnd.microsoft.portable-executable"
            aws s3 cp "$exe.sha256" "s3://$R2_BUCKET/$key.sha256" --endpoint-url "$endpoint" --cache-control "private,max-age=31536000,immutable" --content-type "text/plain"
            aws s3 cp ".release/manifest-$slot.json" "s3://$R2_BUCKET/$prefix/$version/manifest.json" --endpoint-url "$endpoint" --cache-control "private,max-age=31536000,immutable" --content-type "application/json"
            aws s3 cp "$meta" "s3://$R2_BUCKET/$prefix/$version/native-acceptance.json" --endpoint-url "$endpoint" --cache-control "private,max-age=31536000,immutable" --content-type "application/json"
          done
          aws s3 cp .release/index.json "s3://$R2_BUCKET/$prefix/index.json" --endpoint-url "$endpoint" --cache-control "private,max-age=60,must-revalidate" --content-type "application/json"
          aws s3 cp .release/latest.json "s3://$R2_BUCKET/$prefix/latest.json" --endpoint-url "$endpoint" --cache-control "private,max-age=60,must-revalidate" --content-type "application/json"
      - name: Verify R2 internal authority
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-object --bucket "$R2_BUCKET" --key "lightbi-next/releases/latest.json" --endpoint-url "$endpoint" >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET" --key "lightbi-next/releases/index.json" --endpoint-url "$endpoint" >/dev/null
          echo "internal_r2_release=verified"
