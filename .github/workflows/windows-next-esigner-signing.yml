name: NEXT Windows Authenticode Acceptance

on:
  push:
    branches:
      - "codex/native-signing-r1p12-sandbox-*"
      - "codex/native-signing-r1p12-product-*"

permissions:
  contents: read

jobs:
  guard-next-signing:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
    steps:
      - name: Enforce NEXT-only exact-source signing authority
        id: authority
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            codex/native-signing-r1p12-sandbox-*) mode=sandbox; expected="${GITHUB_REF_NAME#codex/native-signing-r1p12-sandbox-}" ;;
            codex/native-signing-r1p12-product-*) mode=product; expected="${GITHUB_REF_NAME#codex/native-signing-r1p12-product-}" ;;
            *) echo "Ref is outside the NEXT signing boundary: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          [[ "${expected}" =~ ^[0-9a-f]{40}$ ]] || { echo "Signing branch must end with the exact lowercase 40-character source SHA." >&2; exit 1; }
          [[ "${expected}" == "${GITHUB_SHA}" ]] || { echo "Signing branch/SHA drift: expected ${expected}, got ${GITHUB_SHA}." >&2; exit 1; }
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "NEXT signing authority accepted for exact source ${GITHUB_SHA} in ${mode} mode."

  windows-esigner-acceptance:
    needs: [guard-next-signing]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LIGHTBI_SIGNED_VERSION: 0.9.2-next.r1p12.signed.${{ github.run_number }}
      LIGHTBI_SIGNED_GENERATION: g-actions-r1p12-signed-${{ github.run_id }}-${{ github.run_attempt }}
      LIGHTBI_SIGNED_CONTROL_PLANE: bb50b0d53542da5cd908e2237cbca368f7f87073
      SSL_COM_ESIGNER_USERNAME: ${{ secrets.SSL_COM_ESIGNER_USERNAME }}
      SSL_COM_ESIGNER_PASSWORD: ${{ secrets.SSL_COM_ESIGNER_PASSWORD }}
      SSL_COM_ESIGNER_TOTP_SECRET: ${{ secrets.SSL_COM_ESIGNER_TOTP_SECRET }}
      SSL_COM_ESIGNER_EXPECTED_SUBJECT: ${{ secrets.SSL_COM_ESIGNER_EXPECTED_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed when eSigner credentials are incomplete
        shell: pwsh
        run: |
          foreach ($name in @('SSL_COM_ESIGNER_USERNAME','SSL_COM_ESIGNER_PASSWORD','SSL_COM_ESIGNER_TOTP_SECRET','SSL_COM_ESIGNER_EXPECTED_SUBJECT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required signing secret is missing: $name" }
          }
          if ($env:SSL_COM_ESIGNER_EXPECTED_SUBJECT -notmatch '^CN=') { throw 'Expected signer subject must be an exact product certificate Subject beginning with CN=.' }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pnpm install --frozen-lockfile
      - name: Verify release, identity and publisher contracts
        shell: pwsh
        run: |
          pnpm test:release-contract
          pnpm test:public-boundary
          pnpm --dir apps/desktop exec vitest run src/stores/update-store.test.ts src/components/settings/UpdateSettingsPanel.test.tsx src/components/settings/BuildIdentityPanel.test.tsx src/lib/native-runtime.test.ts
          cargo test -p lightbi-tauri updater_tests --target x86_64-pc-windows-msvc
          cargo test -p lightbi-tauri windows_publisher --target x86_64-pc-windows-msvc
      - name: Generate branded application icons
        shell: pwsh
        run: |
          pnpm dlx @tauri-apps/cli@2.11.4 icon apps/desktop/public/branding/lightbi-app-icon.png --output crates/lightbi-tauri/icons
          node scripts/validate-native-icons.mjs
      - name: Prepare SSL.com eSigner CKA certificate
        shell: pwsh
        run: |
          ./scripts/prepare-windows-esigner-cka.ps1 -Mode '${{ needs.guard-next-signing.outputs.mode }}' -ExpectedSubject "$env:SSL_COM_ESIGNER_EXPECTED_SUBJECT" -GithubEnvPath "$env:GITHUB_ENV"
      - name: Build and Authenticode-sign exact-source NEXT app and installer
        working-directory: crates/lightbi-tauri
        shell: pwsh
        env:
          VITE_LIGHTBI_GENERATION_ID: ${{ env.LIGHTBI_SIGNED_GENERATION }}
          VITE_LIGHTBI_PARENT_GENERATION_ID: g-2026-09-03-next-030
          VITE_LIGHTBI_CHANNEL: internal
          VITE_LIGHTBI_CORE_COMMIT: ${{ github.sha }}
          VITE_LIGHTBI_CONTROL_PLANE_COMMIT: ${{ env.LIGHTBI_SIGNED_CONTROL_PLANE }}
          VITE_LIGHTBI_CONTROL_PLANE_SCHEMA_VERSION: 067_catalog_quarterly_pricing
          VITE_LIGHTBI_TEST_PACK_VERSION: r1p12-windows-authenticode-acceptance
          VITE_LIGHTBI_TRUST_STATUS: phase2a_unfrozen
          VITE_LIGHTBI_TRUST_PHASE2A_HEAD: 10de4da8e551a46f93f7b62985a0a6e611581b8e
          VITE_LIGHTBI_RELEASE_UPDATE_CHANNEL: internal
          VITE_LIGHTBI_ANALYTICS_NAMESPACE: internal/r1p12-windows-authenticode-acceptance
          VITE_LIGHTBI_RELEASE_NAMESPACE: internal/lightbi/r1p12-windows-authenticode-acceptance
          VITE_LIGHTBI_SOURCE_BRANCH: ${{ github.ref_name }}
          VITE_LIGHTBI_SOURCE_COMMIT: ${{ github.sha }}
          VITE_LIGHTBI_BUILDER: github-actions/windows-next-esigner-acceptance
          VITE_LIGHTBI_INFRA_DATABASE_SCOPE: internal
          VITE_LIGHTBI_INFRA_REDIS_SCOPE: internal
          VITE_LIGHTBI_INFRA_DATA_SCOPE: internal
          VITE_LIGHTBI_INFRA_ANALYTICS_SCOPE: internal
          VITE_LIGHTBI_INFRA_RELEASES_SCOPE: internal
          VITE_LIGHTBI_INFRA_INTEGRATIONS_SCOPE: internal
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LIGHTBI_WINDOWS_PUBLISHER_THUMBPRINT)) { throw 'eSigner publisher thumbprint was not exported.' }
          $env:VITE_LIGHTBI_VERSION = $env:LIGHTBI_SIGNED_VERSION
          $env:VITE_LIGHTBI_BUILD_TIMESTAMP = (Get-Date).ToUniversalTime().ToString('o')
          @{ version = $env:LIGHTBI_SIGNED_VERSION } | ConvertTo-Json | Set-Content tauri.acceptance.conf.json
          @{ bundle = @{ windows = @{ certificateThumbprint = $env:LIGHTBI_WINDOWS_PUBLISHER_THUMBPRINT; digestAlgorithm = 'sha256'; timestampUrl = 'http://ts.ssl.com' } } } | ConvertTo-Json -Depth 5 | Set-Content tauri.esigner.conf.json
          pnpm dlx @tauri-apps/cli@2.11.4 build --target x86_64-pc-windows-msvc --config tauri.windows.conf.json --config tauri.acceptance.conf.json --config tauri.esigner.conf.json
      - name: Prove installed app and installer publisher identity
        shell: pwsh
        run: |
          $releaseRoot = (Resolve-Path 'target/x86_64-pc-windows-msvc/release').Path
          $app = Get-ChildItem $releaseRoot -File -Filter '*.exe' | Where-Object { $_.Directory.FullName -eq $releaseRoot } | Select-Object -First 1
          if (-not $app) { throw 'Signed application executable was not produced.' }
          $installer = Get-ChildItem "$releaseRoot/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw 'Signed NSIS installer was not produced.' }
          $installerName = "LightBI-NEXT-$env:LIGHTBI_SIGNED_VERSION-x64-setup.exe"
          $normalizedInstaller = Join-Path $installer.Directory.FullName $installerName
          Move-Item $installer.FullName $normalizedInstaller -Force

          $appHash = (Get-FileHash -Algorithm SHA256 $app.FullName).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash -Algorithm SHA256 $normalizedInstaller).Hash.ToLowerInvariant()
          "$installerHash  $installerName" | Set-Content -NoNewline "$normalizedInstaller.sha256"
          $appPublisher = "$($app.FullName).publisher.json"
          $installerPublisher = "$normalizedInstaller.publisher.json"
          ./scripts/collect-windows-publisher-evidence.ps1 -Installer $app.FullName -Output $appPublisher
          ./scripts/collect-windows-publisher-evidence.ps1 -Installer $normalizedInstaller -Output $installerPublisher
          $appEvidence = Get-Content $appPublisher -Raw | ConvertFrom-Json
          $installerEvidence = Get-Content $installerPublisher -Raw | ConvertFrom-Json

          if ('${{ needs.guard-next-signing.outputs.mode }}' -eq 'product') {
            node scripts/validate-windows-publisher-evidence.mjs --evidence $appPublisher --mode stable --expected-sha256 $appHash --expected-subject "$env:SSL_COM_ESIGNER_EXPECTED_SUBJECT"
            node scripts/validate-windows-publisher-evidence.mjs --evidence $installerPublisher --mode stable --expected-sha256 $installerHash --expected-subject "$env:SSL_COM_ESIGNER_EXPECTED_SUBJECT"
          } else {
            node scripts/validate-windows-publisher-evidence.mjs --evidence $appPublisher --mode beta --expected-sha256 $appHash
            node scripts/validate-windows-publisher-evidence.mjs --evidence $installerPublisher --mode beta --expected-sha256 $installerHash
            if ($appEvidence.signature_status -eq 'NotSigned' -or -not $appEvidence.signer_subject) { throw 'Sandbox did not sign the application executable.' }
            if ($installerEvidence.signature_status -eq 'NotSigned' -or -not $installerEvidence.signer_subject) { throw 'Sandbox did not sign the installer.' }
          }
          if ($appEvidence.signer_thumbprint -ne $installerEvidence.signer_thumbprint) { throw 'App and installer signer thumbprints differ.' }
          if ($appEvidence.signer_thumbprint -ne $env:LIGHTBI_WINDOWS_PUBLISHER_THUMBPRINT) { throw 'Signed bytes do not match the publisher thumbprint compiled into LightBI.' }

          $acceptance = [ordered]@{
            schema = 'lightbi.native-signed-acceptance.v2'
            environment = 'next_internal_test_only'
            promotable_to_production = $false
            production_authority = $false
            signing_provider = 'ssl.com-esigner-cka'
            signing_mode = '${{ needs.guard-next-signing.outputs.mode }}'
            version = $env:LIGHTBI_SIGNED_VERSION
            generation_id = $env:LIGHTBI_SIGNED_GENERATION
            source_sha = '${{ github.sha }}'
            source_ref = '${{ github.ref_name }}'
            control_plane_sha = $env:LIGHTBI_SIGNED_CONTROL_PLANE
            run_id = '${{ github.run_id }}'
            run_attempt = '${{ github.run_attempt }}'
            application = [ordered]@{ file = $app.Name; sha256 = $appHash; publisher_status = $appEvidence.signature_status }
            installer = [ordered]@{ file = $installerName; sha256 = $installerHash; publisher_status = $installerEvidence.signature_status }
            signer_subject = $installerEvidence.signer_subject
            signer_thumbprint = $installerEvidence.signer_thumbprint
            runtime_expected_thumbprint = $env:LIGHTBI_WINDOWS_PUBLISHER_THUMBPRINT
          }
          $acceptance | ConvertTo-Json -Depth 5 | Set-Content "$($installer.Directory.FullName)/native-signed-acceptance.json"
      - name: Cleanup eSigner CKA ephemeral material
        if: ${{ always() }}
        shell: pwsh
        run: ./scripts/cleanup-windows-esigner-cka.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LightBI-Windows-R1P12-Signed-Acceptance
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/*.exe.publisher.json
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.publisher.json
            target/x86_64-pc-windows-msvc/release/bundle/nsis/native-signed-acceptance.json
          if-no-files-found: error
