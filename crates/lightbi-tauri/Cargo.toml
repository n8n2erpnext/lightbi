[package]
name = "lightbi-tauri"
version = "0.9.2-beta.7"
edition = "2021"
build = "build.rs"
authors = ["Thai Duy <support@thaiduy.digital>"]
description = "Local-first evidence-governed business analysis workspace"
repository = "https://github.com/n8n2erpnext/lightbi"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
lightbi-server = { path = "../../apps/server" }
lightbi-intelligence-pack = { path = "../lightbi-intelligence-pack" }
axum = "0.7.5"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
keyring = "3"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy", "stream", "json"] }
sha2 = "0.10"
base64 = "0.22"
ring = "0.17"
rfd = "0.15"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
