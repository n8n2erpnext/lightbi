[package]
name = "lightbi-tauri"
version = "0.9.2-beta.7"
edition = "2021"
build = "build.rs"
authors = ["Thai Duy <support@thaiduy.digital>"]
description = "Local-first evidence-governed business analysis workspace"
homepage = "https://lightbi.thaiduy.digital"
repository = "https://github.com/n8n2erpnext/lightbi"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
lightbi-server = { path = "../../apps/server" }
axum = "0.7.5"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
keyring = "3"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
