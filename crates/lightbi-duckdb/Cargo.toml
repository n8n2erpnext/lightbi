[package]
name = "lightbi-duckdb"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
duckdb = { version = "1.1.1", features = ["bundled"] }
lightbi-planner = { path = "../lightbi-planner" }
lightbi-runtime-backend = { path = "../lightbi-runtime-backend" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
